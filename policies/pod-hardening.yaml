# Politique 2 : rejette tout Pod du namespace tp4 qui ne respecte pas le
# durcissement de l'etape 2 (root, privilege, tag :latest, FS, capabilities, limites).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pod-hardening
  annotations:
    policies.kyverno.io/title: Durcissement obligatoire des Pods
    policies.kyverno.io/severity: high
spec:
  background: true
  rules:
    - name: disallow-latest-tag
      match:
        any:
          - resources: {kinds: [Pod], namespaces: [tp4]}
      validate:
        failureAction: Enforce
        message: "Tag mutable interdit : l'image doit avoir une version immuable ou un digest (pas de :latest)."
        foreach:
          - list: "request.object.spec.[containers, initContainers, ephemeralContainers][]"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest*"
                  - key: "{{ contains(element.image, ':') || contains(element.image, '@') }}"
                    operator: Equals
                    value: false
    - name: disallow-root
      match:
        any:
          - resources: {kinds: [Pod], namespaces: [tp4]}
      validate:
        failureAction: Enforce
        message: "Execution en root interdite : runAsNonRoot doit valoir true et runAsUser ne peut pas etre 0."
        pattern:
          spec:
            =(securityContext):
              =(runAsUser): ">0"
            containers:
              - securityContext:
                  runAsNonRoot: true
                  =(runAsUser): ">0"
    - name: disallow-privileged
      match:
        any:
          - resources: {kinds: [Pod], namespaces: [tp4]}
      validate:
        failureAction: Enforce
        message: "Conteneur privilegie ou escalade de privileges interdits (privileged: false, allowPrivilegeEscalation: false)."
        pattern:
          spec:
            containers:
              - securityContext:
                  =(privileged): false
                  allowPrivilegeEscalation: false
    - name: require-readonly-rootfs-drop-all
      match:
        any:
          - resources: {kinds: [Pod], namespaces: [tp4]}
      validate:
        failureAction: Enforce
        message: "readOnlyRootFilesystem: true et capabilities.drop: [ALL] sont obligatoires."
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]
    - name: require-resource-limits
      match:
        any:
          - resources: {kinds: [Pod], namespaces: [tp4]}
      validate:
        failureAction: Enforce
        message: "Limites CPU et memoire obligatoires."
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    cpu: "?*"
                    memory: "?*"
